[project]
name = "unito-hci-data-analysis-25-26"
version = "0.1.0"
description = "HCI Assignment 2025-2026: Anime Data Storytelling and Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "jupyterlab>=4.5.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# This pins the exact Python version for the team to ensure consistency
package = false
