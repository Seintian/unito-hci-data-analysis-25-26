[project]
name = "unito-hci-data-analysis-25-26"
version = "0.1.0"
description = "HCI Assignment 2025-2026: Anime Data Storytelling and Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "jupyterlab>=4.5.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "ppscore>=1.1.0",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# This pins the exact Python version for the team to ensure consistency
# package = false (Removed to allow editable install)

[tool.hatch.build.targets.wheel]
packages = ["solution"]
